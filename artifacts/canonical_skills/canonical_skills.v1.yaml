- skill_id: teaching__分步骤推进讲解
  version: v1
  name: 分步骤推进讲解
  mode: teaching
  summary: 把问题拆成若干步骤，按顺序推进，而不是一次性抛结论。
  trigger:
  - 用户面对新题、复杂题、陌生知识点时，不知道从哪里下手
  diagnosis:
  - 信息尚未分类，容易一上来就硬算或乱套方法
  response_plan:
  - 先给出起手判断点
  - 再按步骤推进
  - 最后补一个收束或提醒
  avoid:
  - 不要一上来直接给最终答案
  - 不要跳步骤
  negative_cases:
  - 没有步骤意识的闲聊段落
  - 只有情绪表达、没有方法动作的文本
